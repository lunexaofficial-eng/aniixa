    <script>
      // In AI Studio iframe environment, HMR is disabled or WebSocket proxying is bypassed.
      // Suppress unhandled WebSocket rejections from @vite/client module runner.
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
        var stack = (e && e.reason && e.reason.stack) || '';
        if (msg.indexOf('WebSocket') !== -1 || stack.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) || '';
        var filename = (e && e.filename) || '';
        if (msg.indexOf('WebSocket') !== -1 || filename.indexOf('@vite/client') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
  </head>

  </body>
